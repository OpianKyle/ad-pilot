openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for AdPilot Business campaign management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: authentication
    description: Account registration and session management
  - name: campaigns
    description: Business campaign management
  - name: adpilot
    description: AdPilot workspace, creative, publishing, and owner features
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [authentication]
      summary: Get a CSRF token for form submissions
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [authentication]
      summary: Get the signed-in account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Authentication required
  /auth/register:
    post:
      operationId: registerAccount
      tags: [authentication]
      summary: Register a business account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
        "422":
          description: Registration details are invalid
  /auth/login:
    post:
      operationId: loginAccount
      tags: [authentication]
      summary: Sign in to a business account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [authentication]
      summary: Sign out of the current account
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [campaigns]
      summary: Get campaign totals and recent activity
      responses:
        "200":
          description: Campaign overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List the current business's campaigns
      responses:
        "200":
          description: Campaigns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignList"
        "401":
          description: Authentication required
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Authentication required
        "422":
          description: Campaign details are invalid
  /adpilot/workspace:
    get:
      operationId: getAdpilotWorkspace
      tags: [adpilot]
      summary: Get workspace settings and account limits
      responses:
        "200":
          description: Workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdpilotWorkspace"
        "401":
          description: Authentication required
    put:
      operationId: saveAdpilotWorkspace
      tags: [adpilot]
      summary: Save brand, channel, and generation defaults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdpilotWorkspaceSettings"
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "422":
          description: Invalid settings
  /adpilot/credentials:
    get:
      operationId: getAdpilotCredentials
      tags: [adpilot]
      summary: Get provider connection status without secrets
      responses:
        "200":
          description: Configured credential flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
    put:
      operationId: saveAdpilotCredentials
      tags: [adpilot]
      summary: Save encrypted provider credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCredentialsInput"
      responses:
        "200":
          description: Credentials saved; secret values are not returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
  /adpilot/assets:
    get:
      operationId: listAdpilotAssets
      tags: [adpilot]
      summary: List workspace photographs
      responses:
        "200":
          description: Workspace photographs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaList"
  /adpilot/assets/upload-url:
    post:
      operationId: requestAdpilotAssetUpload
      tags: [adpilot]
      summary: Request a private direct-upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Upload URL and pending asset id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
  /adpilot/assets/{id}/complete:
    post:
      operationId: completeAdpilotAssetUpload
      tags: [adpilot]
      summary: Validate and finalize a photograph upload
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaCompleteInput"
      responses:
        "200":
          description: Sanitized photograph saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
  /adpilot/assets/{id}/content:
    get:
      operationId: getAdpilotAssetContent
      tags: [adpilot]
      summary: View a photograph belonging to the current workspace
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      responses:
        "200":
          description: Photograph bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Photograph not found
  /adpilot/assets/{id}:
    delete:
      operationId: deleteAdpilotAsset
      tags: [adpilot]
      summary: Remove an unused workspace photograph
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      responses:
        "200":
          description: Photograph removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /adpilot/briefs:
    get:
      operationId: listAdpilotBriefs
      tags: [adpilot]
      summary: List saved campaign briefs
      responses:
        "200":
          description: Campaign briefs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefList"
    post:
      operationId: createAdpilotBrief
      tags: [adpilot]
      summary: Save a campaign brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefInput"
      responses:
        "201":
          description: Campaign brief created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
  /adpilot/briefs/{id}:
    put:
      operationId: updateAdpilotBrief
      tags: [adpilot]
      summary: Update a campaign brief
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefInput"
      responses:
        "200":
          description: Campaign brief updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
    delete:
      operationId: deleteAdpilotBrief
      tags: [adpilot]
      summary: Delete a campaign brief
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      responses:
        "200":
          description: Campaign brief deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /adpilot/briefs/{id}/autopilot:
    post:
      operationId: setAdpilotBriefAutopilot
      tags: [adpilot]
      summary: Pause or activate daily generation for a brief
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotInput"
      responses:
        "200":
          description: Daily generation setting changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /adpilot/creatives:
    get:
      operationId: listAdpilotCreatives
      tags: [adpilot]
      summary: List generated campaign drafts and delivery state
      responses:
        "200":
          description: Workspace creatives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeList"
    post:
      operationId: createAdpilotCreatives
      tags: [adpilot]
      summary: Queue one to four AI creative drafts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreativeCreateInput"
      responses:
        "202":
          description: Creative jobs queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeList"
  /adpilot/creatives/{id}:
    get:
      operationId: getAdpilotCreative
      tags: [adpilot]
      summary: Get one creative from the current workspace
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      responses:
        "200":
          description: Creative detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creative"
        "404":
          description: Creative not found
    patch:
      operationId: updateAdpilotCreative
      tags: [adpilot]
      summary: Edit a ready creative's copy
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreativeEditInput"
      responses:
        "200":
          description: Creative updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creative"
  /adpilot/creatives/{id}/duplicate:
    post:
      operationId: duplicateAdpilotCreative
      tags: [adpilot]
      summary: Duplicate a saved creative as a new draft
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      responses:
        "201":
          description: Draft duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creative"
  /adpilot/creatives/{id}/archive:
    post:
      operationId: archiveAdpilotCreative
      tags: [adpilot]
      summary: Archive a local creative
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      responses:
        "200":
          description: Creative archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /adpilot/creatives/{id}/schedule:
    post:
      operationId: scheduleAdpilotCreative
      tags: [adpilot]
      summary: Schedule a ready creative for publishing
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "200":
          description: Creative scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creative"
  /adpilot/creatives/{id}/publish:
    post:
      operationId: publishAdpilotCreative
      tags: [adpilot]
      summary: Queue a ready creative for immediate publishing
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      responses:
        "202":
          description: Publishing queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creative"
  /adpilot/connections/verify:
    post:
      operationId: verifyAdpilotConnections
      tags: [adpilot]
      summary: Check configured social account identities
      responses:
        "200":
          description: Provider connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionVerification"
  /adpilot/connections/meta:
    get:
      operationId: getAdpilotMetaConnection
      tags: [adpilot]
      summary: Get the current business's Meta connection and shared assets
      responses:
        "200":
          description: Meta connection details without access tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaConnectionStatus"
    delete:
      operationId: disconnectAdpilotMeta
      tags: [adpilot]
      summary: Disconnect Meta and cancel its pending posts
      responses:
        "200":
          description: Meta connection removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /adpilot/connections/meta/select:
    put:
      operationId: selectAdpilotMetaAssets
      tags: [adpilot]
      summary: Choose the Facebook Page and Instagram account for this business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaAssetSelectionInput"
      responses:
        "200":
          description: Publishing destinations saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaConnectionStatus"
        "422":
          description: Selected assets were not shared with this app
  /adpilot/posts:
    get:
      operationId: listAdpilotScheduledPosts
      tags: [adpilot]
      summary: List this business's scheduled Meta posts
      responses:
        "200":
          description: Scheduled and published posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledPostList"
    post:
      operationId: createAdpilotScheduledPost
      tags: [adpilot]
      summary: Schedule a photo and caption for selected Meta channels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledPostInput"
      responses:
        "201":
          description: Post scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledPost"
        "422":
          description: Post details or destinations are invalid
  /adpilot/posts/{id}:
    delete:
      operationId: cancelAdpilotScheduledPost
      tags: [adpilot]
      summary: Cancel a post that has not started publishing
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
      responses:
        "200":
          description: Post cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "409":
          description: Publishing has already started
  /adpilot/oauth/meta/callback:
    get:
      operationId: completeAdpilotMetaOAuth
      tags: [adpilot]
      summary: Finish Meta authorization and save shared business assets
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the workspace connection page
        "400":
          description: OAuth state was invalid or expired
  /meta/data-deletion:
    post:
      operationId: receiveMetaDataDeletionRequest
      tags: [privacy]
      summary: Verify and process Meta's signed data-deletion request
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MetaDataDeletionInput"
      responses:
        "200":
          description: Deletion receipt and status URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaDeletionReceipt"
        "400":
          description: Signed request was missing or invalid
  /meta/data-deletion/{code}:
    get:
      operationId: getMetaDataDeletionStatus
      tags: [privacy]
      summary: Check the completion status of a Meta deletion request
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{32}$"
      responses:
        "200":
          description: Deletion request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaDeletionStatus"
        "404":
          description: Confirmation code not found
  /adpilot/oauth/{provider}/start:
    post:
      operationId: startAdpilotOAuth
      tags: [adpilot]
      summary: Begin a provider account authorization
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [meta, linkedin]
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStartResponse"
  /adpilot/admin/accounts:
    get:
      operationId: listAdpilotAdminAccounts
      tags: [adpilot]
      summary: List accounts for the configured service owner
      responses:
        "200":
          description: Adviser account summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountList"
        "403":
          description: Owner access required
  /adpilot/admin/accounts/{businessId}:
    patch:
      operationId: updateAdpilotAdminAccount
      tags: [adpilot]
      summary: Activate, suspend, or update an account allowance
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountUpdate"
      responses:
        "200":
          description: Account controls updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: Owner access required
  /adpilot/admin/accounts/{businessId}/reset-link:
    post:
      operationId: createAdpilotPasswordReset
      tags: [adpilot]
      summary: Create a one-use password reset link
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: One-use reset link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetLink"
        "403":
          description: Owner access required
  /adpilot/dashboard:
    get:
      operationId: getAdpilotDashboard
      tags: [adpilot]
      summary: Get overview, job, and publishing activity
      responses:
        "200":
          description: Workspace overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdpilotDashboard"
  /adpilot/paid:
    get:
      operationId: listAdpilotPaidCampaigns
      tags: [adpilot]
      summary: List paid Facebook campaign plans
      responses:
        "200":
          description: Paid plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaidCampaignList"
    post:
      operationId: createAdpilotPaidCampaign
      tags: [adpilot]
      summary: Save a validated ZAR Facebook traffic plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaidCampaignInput"
      responses:
        "201":
          description: Local paid plan created, not yet sent to Meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaidCampaign"
  /adpilot/paid/{id}/{action}:
    post:
      operationId: actOnAdpilotPaidCampaign
      tags: [adpilot]
      summary: Submit, launch, pause, or refresh a Meta campaign
      parameters:
        - $ref: "#/components/parameters/AdpilotId"
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [submit, launch, pause, refresh]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaidCampaignAction"
      responses:
        "200":
          description: Provider status and updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaidCampaign"
components:
  parameters:
    AdpilotId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CsrfToken:
      type: object
      properties:
        csrf:
          type: string
      required: [csrf]
    User:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, member]
        workspaceStatus:
          type: string
          enum: [pending, active, suspended]
      required: [id, businessId, name, email, role, workspaceStatus]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]
    RegistrationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        business:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 256
      required: [name, business, email, password]
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
      required: [email, password]
    LogoutResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    Campaign:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        caption:
          type: ["string", "null"]
        hashtags:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, scheduled, published]
        createdAt:
          type: string
          format: date-time
      required: [id, title, status, createdAt]
    CampaignInput:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 180
        caption:
          type: string
          maxLength: 10000
        hashtags:
          type: string
          maxLength: 2000
      required: [title, caption, hashtags]
    CampaignList:
      type: object
      properties:
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"
      required: [campaigns]
    DashboardSummary:
      type: object
      properties:
        total:
          type: integer
        draft:
          type: integer
        scheduled:
          type: integer
        published:
          type: integer
        recentCampaigns:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"
      required: [total, draft, scheduled, published, recentCampaigns]
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    AdpilotWorkspaceSettings:
      type: object
      properties:
        brand:
          type: string
          maxLength: 150
        audience:
          type: string
          maxLength: 1000
        facts:
          type: string
          maxLength: 5000
        offer:
          type: string
          maxLength: 2000
        voice:
          type: string
          maxLength: 300
        cta:
          type: string
          maxLength: 150
        destination:
          type: string
          format: uri
        facebookUrl:
          type: string
          maxLength: 500
        instagramUrl:
          type: string
          maxLength: 500
        linkedinUrl:
          type: string
          maxLength: 500
        disclosure:
          type: string
          maxLength: 350
        timezone:
          type: string

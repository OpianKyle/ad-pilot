openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for AdPilot Business campaign management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: authentication
    description: Account registration and session management
  - name: campaigns
    description: Business campaign management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [authentication]
      summary: Get a CSRF token for form submissions
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [authentication]
      summary: Get the signed-in account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Authentication required
  /auth/register:
    post:
      operationId: registerAccount
      tags: [authentication]
      summary: Register a business account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
        "422":
          description: Registration details are invalid
  /auth/login:
    post:
      operationId: loginAccount
      tags: [authentication]
      summary: Sign in to a business account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [authentication]
      summary: Sign out of the current account
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [campaigns]
      summary: Get campaign totals and recent activity
      responses:
        "200":
          description: Campaign overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List the current business's campaigns
      responses:
        "200":
          description: Campaigns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignList"
        "401":
          description: Authentication required
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Authentication required
        "422":
          description: Campaign details are invalid
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CsrfToken:
      type: object
      properties:
        csrf:
          type: string
      required: [csrf]
    User:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, member]
      required: [id, businessId, name, email, role]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]
    RegistrationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        business:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 256
      required: [name, business, email, password]
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
      required: [email, password]
    LogoutResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    Campaign:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        caption:
          type: ["string", "null"]
        hashtags:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, scheduled, published]
        createdAt:
          type: string
          format: date-time
      required: [id, title, status, createdAt]
    CampaignInput:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 180
        caption:
          type: string
          maxLength: 10000
        hashtags:
          type: string
          maxLength: 2000
      required: [title, caption, hashtags]
    CampaignList:
      type: object
      properties:
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"
      required: [campaigns]
    DashboardSummary:
      type: object
      properties:
        total:
          type: integer
        draft:
          type: integer
        scheduled:
          type: integer
        published:
          type: integer
        recentCampaigns:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"
      required: [total, draft, scheduled, published, recentCampaigns]

